<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PANTHEOS GLOBAL STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

a{
text-decoration:none;
color:white;
}

img{
max-width:100%;
display:block;
}

.container{
width:95%;
max-width:1400px;
margin:auto;
}

section{
padding:80px 0;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px 20px;
background:
linear-gradient(
135deg,
#050505,
#0f172a,
#111827,
#1e40af
);
position:relative;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:#2563eb;
filter:blur(180px);
opacity:.2;
top:-150px;
right:-150px;
}

.logo{
width:280px;
margin:auto;
border-radius:25px;
box-shadow:
0 0 30px #2563eb,
0 0 80px #2563eb;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

.hero h1{
font-size:clamp(40px,7vw,90px);
font-weight:800;
margin-top:25px;
white-space:nowrap;
}

.hero p{
font-size:20px;
max-width:900px;
margin:20px auto;
color:#d1d5db;
}

.badges{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-top:30px;
}

.badges span{
background:#111827;
padding:12px 18px;
border-radius:50px;
border:1px solid #374151;
}

.hero-buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-top:35px;
}

.btn{
padding:15px 30px;
border-radius:50px;
background:#2563eb;
font-weight:700;
transition:.3s;
}

.btn:hover{
transform:translateY(-5px);
}

.section-title{
font-size:42px;
text-align:center;
margin-bottom:50px;
font-weight:800;
background:linear-gradient(90deg,#00d4ff,#6366f1);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.games-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
padding:25px;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:
0 0 30px rgba(37,99,235,.4);
}

.price{
font-size:26px;
font-weight:700;
color:#00ff99;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
border-radius:20px;
overflow:hidden;
}

th{
background:#2563eb;
padding:15px;
}

td{
padding:14px;
border-bottom:1px solid #374151;
}

.order-form{
background:#111827;
padding:30px;
border-radius:25px;
}

input,select{
width:100%;
padding:15px;
margin-top:12px;
background:#0b1220;
border:1px solid #374151;
color:white;
border-radius:12px;
}

.submit-btn{
width:100%;
margin-top:20px;
padding:15px;
background:#2563eb;
border:none;
color:white;
font-size:18px;
border-radius:12px;
}

.qr{
max-width:320px;
margin:auto;
border-radius:20px;
box-shadow:0 0 30px rgba(255,255,255,.1);
}

footer{
padding:50px 20px;
text-align:center;
background:#020202;
border-top:1px solid #222;
}

.whatsapp{
position:fixed;
right:20px;
bottom:20px;
background:#25D366;
padding:15px 20px;
border-radius:50px;
font-weight:700;
z-index:9999;
}

</style>
</head>

<body>
